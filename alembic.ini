# Configuração do Alembic.
# A URL do banco NÃO fica aqui: é resolvida em migrations/env.py a partir de
# `Settings`, para que exista uma única fonte de configuração (plano §17).

[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os
# Revisões nomeadas com prefixo sequencial: a ordem no diretório é a ordem real.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
