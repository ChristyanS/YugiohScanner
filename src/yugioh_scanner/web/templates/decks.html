{% extends "base.html" %}
{% block title %}{{ t('decks.title') }} — Yu-Gi-Oh! Scanner{% endblock %}
{% block content %}
<h1>{{ t('decks.title') }}</h1>

<article id="form-error"></article>

<form id="new-deck-form">
  <div class="grid">
    <label>{{ t('decks.name_label') }}
      <input type="text" name="name" id="deck-name-input" required>
    </label>
    <label>{{ t('decks.build_mode_label') }}
      <select name="build_mode">
        {% for mode in build_modes %}
        <option value="{{ mode }}">{{ t('deck.build_mode.collection_only') if mode == "collection_only" else t('deck.build_mode.full_db') }}</option>
        {% endfor %}
      </select>
    </label>
    <label>{{ t('decks.banlist_label') }}
      <select name="banlist">
        {% for banlist in banlists %}
        <option value="{{ banlist }}">{{ banlist }}</option>
        {% endfor %}
      </select>
    </label>
  </div>
  <button type="submit">{{ t('decks.create_button') }}</button>
</form>

<hr>

<div id="decks-list"></div>

<script>
const errorBox = document.getElementById("form-error");
const form = document.getElementById("new-deck-form");
const decksList = document.getElementById("decks-list");

function showError(message) {
  errorBox.innerHTML = message ? `<div class="error-box">${message}</div>` : "";
}

//: Guardado pelo id — as ações de exclusão (por deck) precisam do nome só
//: para a mensagem de confirmação, e ler daqui evita jogar o nome dentro de
//: um atributo HTML (que quebraria com aspas no nome do deck).
let decksById = new Map();

// Capa = `cover_card_id` escolhido no editor (botão "Definir como capa" em
// `deck_editor.html`) ou, na ausência de um, a primeira carta do deck — só
// dá para calcular esse fallback aqui porque `GET /api/v1/decks` manda as
// cartas de cada deck junto (mesmo formato de `GET /api/v1/decks/{id}`).
function deckCoverCardId(deck) {
  return deck.cover_card_id || (deck.cards && deck.cards[0] && deck.cards[0].card_id) || null;
}

async function loadDecks() {
  const res = await fetch("/api/v1/decks");
  const decks = await res.json();
  decksById = new Map(decks.map((d) => [d.id, d]));
  if (!decks.length) {
    decksList.innerHTML = `<p><em>${t("decks.no_decks")}</em></p>`;
    return;
  }
  const cards = decks.map((d) => {
    const coverId = deckCoverCardId(d);
    const modeLabel = d.build_mode === "collection_only"
      ? t("deck.build_mode.collection_only") : t("deck.build_mode.full_db");
    return `
      <div class="gallery-item deck-gallery-item">
        <a href="/decks/${d.id}">
          <div class="gallery-thumb">
            ${coverId ? `<img src="/api/v1/cards/${coverId}/image?size=small" loading="lazy" alt="">` : ""}
          </div>
          <span class="gallery-caption">${d.name}</span>
        </a>
        <span class="gallery-print-info">${modeLabel} &middot; ${d.banlist}</span>
        <button type="button" class="contrast outline" data-delete-deck="${d.id}">${t("decks.delete_button")}</button>
      </div>
    `;
  }).join("");
  decksList.innerHTML = `
    <div class="gallery-grid">${cards}</div>
    <button type="button" id="clear-all-decks-button" class="contrast outline">${t("decks.clear_all_button")}</button>
  `;
  wireDeckActions();
}

// Reconstruído a cada `loadDecks()` (a lista inteira é substituída via
// `innerHTML`), então os listeners precisam ser religados a cada chamada —
// mesmo motivo de `manualSearchResults`/`candidatesEl` em review.html.
function wireDeckActions() {
  decksList.querySelectorAll("[data-delete-deck]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const deckId = parseInt(btn.dataset.deleteDeck, 10);
      const deck = decksById.get(deckId);
      if (!confirm(t("decks.confirm_delete", { name: deck ? deck.name : deckId }))) return;
      const res = await fetch(`/api/v1/decks/${deckId}`, { method: "DELETE" });
      if (!res.ok) { showError(t("decks.delete_failed")); return; }
      showError("");
      await loadDecks();
    });
  });
  const clearAllButton = document.getElementById("clear-all-decks-button");
  if (clearAllButton) {
    clearAllButton.addEventListener("click", async () => {
      if (!confirm(t("decks.confirm_clear_all"))) return;
      const res = await fetch("/api/v1/decks", { method: "DELETE" });
      if (!res.ok) { showError(t("decks.delete_failed")); return; }
      showError("");
      await loadDecks();
    });
  }
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  showError("");
  const body = {
    name: form.name.value,
    build_mode: form.build_mode.value,
    banlist: form.banlist.value,
  };
  const res = await fetch("/api/v1/decks", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const payload = await res.json();
  if (!res.ok) { showError(payload.error || t("decks.create_failed")); return; }
  window.location.href = `/decks/${payload.id}`;
});

loadDecks();
</script>
{% endblock %}
