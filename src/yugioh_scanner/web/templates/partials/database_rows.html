<table>
  <thead>
    <tr><th></th><th>Carta</th><th>Tipo</th><th>Atributo</th><th>Arquétipo</th></tr>
  </thead>
  <tbody>
    {% for card in cards %}
    <tr>
      <td><img class="thumb" src="/api/v1/cards/{{ card.id }}/image?size=small" loading="lazy" alt=""></td>
      <td><a href="/cards/{{ card.id }}">{{ card.name }}</a></td>
      <td>{{ card.human_readable_type or card.type }}</td>
      <td>{{ card.attribute or "" }}</td>
      <td>{{ card.archetype or "" }}</td>
    </tr>
    {% else %}
    <tr><td colspan="5"><em>Nenhuma carta encontrada.</em></td></tr>
    {% endfor %}
  </tbody>
</table>
