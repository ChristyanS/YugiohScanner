[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yugioh-scanner"
version = "0.1.0"
description = "Scanner e gerenciador de coleção de cartas de Yu-Gi-Oh!"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ChristyanS" }]

dependencies = [
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "structlog>=24.1",
]

[project.optional-dependencies]
# Motor de OCR padrão (pip puro, sem dependência de sistema no Windows).
ocr = ["rapidocr-onnxruntime>=1.3", "pillow>=10.3", "rapidfuzz>=3.9"]
# Motores alternativos, todos por trás do mesmo Protocol.
tesseract = ["pytesseract>=0.3.10"]
paddle = ["paddleocr>=2.7", "paddlepaddle>=2.6"]
easyocr = ["easyocr>=1.7"]
# Fallback por LLM Vision.
llm = ["anthropic>=0.40"]
# Interface web.
web = ["fastapi>=0.111", "uvicorn[standard]>=0.30", "jinja2>=3.1", "python-multipart>=0.0.9"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
yugioh-scanner = "yugioh_scanner.cli.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/yugioh_scanner"]

# ---------------------------------------------------------------- ferramentas

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "PTH", "RUF"]
ignore = [
    "B008",   # Typer usa chamadas de função como default de argumento
    "RUF001", # texto em português tem caracteres unicode legítimos
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"migrations/*" = ["E501", "N999"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

# Strict onde a lógica pura vive — é lá que os bugs silenciosos moram.
[[tool.mypy.overrides]]
module = ["yugioh_scanner.domain.*", "yugioh_scanner.matching.*", "yugioh_scanner.exporters.*"]
disallow_untyped_defs = true
disallow_any_generics = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["rapidocr_onnxruntime.*", "pytesseract.*", "paddleocr.*", "easyocr.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# A suíte principal precisa terminar em segundos, ou ninguém a roda.
addopts = "-m 'not ocr and not slow' --strict-markers"
markers = [
    "ocr: usa um motor de OCR real e um corpus de fotos (opt-in: pytest -m ocr)",
    "slow: leva mais de alguns segundos",
    "network: precisa de rede de verdade (nunca roda no CI)",
]

[tool.coverage.run]
source = ["src/yugioh_scanner"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
